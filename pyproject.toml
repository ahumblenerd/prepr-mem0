[project]
name = "prepr-mem0"
version = "0.0.1"
description = "Durable Mem0-style memory API on Restate + FastAPI"
requires-python = ">=3.12,<3.13"
readme = "ARCH.md"
authors = [{ name = "Arun" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "pgvector>=0.3.6",
  "pydantic>=2.10.0",
  "restate-sdk>=0.18.0",
  "openai>=2.37.0",
  "httpx[http2]>=0.28.1",
]

[dependency-groups]
dev = [
  "ruff>=0.14.0",
  "pyright>=1.1.405",
  "bandit>=1.8.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "pre-commit>=4.0.0",
  "httpx>=0.28.0",
  "respx>=0.22.0",
  "time-machine>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prepr_mem0"]

# -----------------------------------------------------------------------------
# Ruff — single tool for lint + format. Aggressive "select=ALL" with a curated
# ignore list. Touch nothing else without a reason.
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["sdk-python", "migrations/versions"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",       # pydocstyle: no enforced module/function docstrings
  "COM812",  # trailing comma — conflicts with formatter
  "ISC001",  # implicit string concat — conflicts with formatter
  "FIX",     # FIXME/TODO comments are allowed
  "TD",      # todo formatting
  "CPY",     # no copyright header required
  "FBT",     # boolean trap — overzealous on FastAPI handlers
  "PLR0913", # too-many-arguments — FastAPI handlers naturally violate
  "TC001",   # typing-only first-party — SQLAlchemy mapped_column needs runtime types
  "TC002",   # typing-only third-party — same as above for sqlalchemy / FastAPI
  "TC003",   # typing-only stdlib — same as above
  "B008",    # Depends() in defaults is the FastAPI idiom
]
unfixable = ["F401"]  # don't silently remove unused imports during a fix

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",   # asserts are the point in tests
  "PLR2004",# magic numbers are fine in tests
  "ANN",    # type annotations optional in tests
  "INP001", # implicit namespace package
]
"src/prepr_mem0/__init__.py" = ["D104"]
# Prompts are verbatim assets from upstream mem0; line length is theirs.
"src/prepr_mem0/llm/prompts.py" = ["E501"]
# Chaos test orchestrates subprocesses + a fake HTTP server.
"tests/chaos/**" = [
  "S603", "S607",      # subprocess + partial path are the point
  "S110",              # poll loops swallow expected ConnectionError
  "ASYNC230", "ASYNC240",  # fake server + tests do small sync FS reads
  "BLE001",            # broad except in poll loops is intentional
  "SIM105", "SIM115",  # contextlib.suppress is overkill for a one-liner; log files stay open
  "TRY300",            # try/return is fine for poll-and-retry loops
  "PLC0415", "ARG001", # dynamic reimport for a fixture is the point
  "F401",              # the orchestration test uses dynamic imports
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

# -----------------------------------------------------------------------------
# Pyright — strict everywhere. The contract is: if it type-checks, it runs.
# -----------------------------------------------------------------------------
[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", "sdk-python", "migrations"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "warning"

# Strict on src/, basic on tests/. Test fixtures pull in third-party untyped
# returns (pytest, httpx) that aren't worth annotating around.
executionEnvironments = [
  { root = "src", reportUnknownMemberType = "warning" },
  { root = "tests", reportUnknownMemberType = "none", reportUnknownVariableType = "none", reportUnknownParameterType = "none", reportUnknownArgumentType = "none", reportMissingParameterType = "none", reportMissingTypeArgument = "none", reportUntypedFunctionDecorator = "none", reportAttributeAccessIssue = "warning" },
]

# -----------------------------------------------------------------------------
# Bandit — security baseline.
# -----------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", "sdk-python", ".venv"]

# -----------------------------------------------------------------------------
# Pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-x --strict-markers --strict-config --cov=src/prepr_mem0 --cov-report=term-missing --cov-fail-under=85 -m 'not chaos'"
testpaths = ["tests"]
markers = [
  "integration: hits real services (Postgres, Restate)",
  "chaos: kills processes mid-flight; needs docker compose",
  "live: hits real OpenRouter; gated by env",
]

[tool.coverage.run]
branch = true
omit = ["src/prepr_mem0/__init__.py"]
